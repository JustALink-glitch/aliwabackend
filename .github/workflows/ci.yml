name: CI

on:
  push:
    branches: [synqop-v1]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test 2>&1 | tee test.log
        shell: bash
      - name: Show test failures as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "FAIL|×|Error|Expected|Received|expected|Timed out|Unhandled" test.log | head -40 | sed -E 's/\x1b\[[0-9;]*m//g' | paste -sd '|' | fold -w 1500 | head -8 | while IFS= read -r line; do echo "::error::$line"; done
      - run: npm run build
